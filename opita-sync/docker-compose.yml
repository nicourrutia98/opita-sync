services:
  postgres:
    image: postgres:16-alpine
    container_name: opita-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opita_sync
    ports:
      - "5432:5432"
    volumes:
      - opita_sync_pgdata:/var/lib/postgresql/data

  backend:
    image: node:20-alpine
    container_name: opita-sync-backend
    depends_on:
      - postgres
    working_dir: /app
    command: sh -lc "npm --prefix backend install && npm --prefix backend run prisma:generate && npm --prefix backend run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opita_sync?schema=public
      JWT_SECRET: dev-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: "7"
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./:/app

volumes:
  opita_sync_pgdata:
