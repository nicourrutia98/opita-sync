services:
  postgres:
    image: postgres:16
    container_name: opita-sync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opita_sync
    ports:
      - "54329:5432"
    volumes:
      - opita_sync_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opita_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opita_sync_postgres:
